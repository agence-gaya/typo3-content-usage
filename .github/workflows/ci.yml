name: ci
on: [ push, pull_request ]
jobs:
  ci:
    name: Tests with TYPO3 ${{ matrix.typo3 }} PHP ${{ matrix.php }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        typo3: [ '^14.3' ]
        php: [ '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite

      - name: Get composer cache directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_DIRECTORY=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_DIRECTORY }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies with typo3/cms-core:${{ matrix.typo3 }}
        run: composer require typo3/cms-core:${{ matrix.typo3 }} --prefer-dist --no-progress --optimize-autoloader

      - name: Info
        run: composer info

      - name: PHP Lint
        run: composer coder:phplint --ci

      - name: TypoScript Lint
        run: composer coder:typoscript-lint --ci

      - name: YAML Lint
        run: composer coder:yaml-lint --ci

      - name: PHP CS Fixer
        run: composer coder:php-cs-fixer --ci

      - name: Rector
        if: matrix.php == '8.2'
        run: composer coder:rector --ci

      - name: Fractor
        run: composer coder:fractor --ci

      - name: Unit tests
        run: composer coder:tests:unit --ci

      - name: Functional tests
        run: composer coder:tests:functional --ci
